<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#fff3da">
    <meta name="description" content="Тёплые воспоминания для Оли — в фотографиях и голосах друзей.">
    <title>Подарок Оле</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main id="memories" aria-label="Воспоминания для Оли"></main>
    <noscript><p class="no-script">Чтобы посмотреть фотографии и послушать воспоминание, включите JavaScript в браузере.</p></noscript>
    <dialog class="viewer" id="viewer" aria-label="Просмотр воспоминаний">
      <div class="viewer__top">
        <span class="viewer__counter" aria-live="polite"></span>
        <button class="icon-button viewer__close" type="button" aria-label="Закрыть просмотр"></button>
      </div>
      <button class="icon-button viewer__previous" type="button" aria-label="Предыдущее фото"></button>
      <div class="viewer__stage"></div>
      <button class="icon-button viewer__next" type="button" aria-label="Следующее фото"></button>
      <p class="viewer__error" role="status" hidden></p>
    </dialog>
  </body>
</html>
